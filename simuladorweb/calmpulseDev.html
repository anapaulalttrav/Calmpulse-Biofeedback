<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3F2">
<meta name="description" content="CalmPulse: painel do protótipo de biofeedback de baixo custo. Projeto de extensão FMU, ODS 3.">
<title>CalmPulse: Painel de Biofeedback (FMU)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. TOKENS
   ========================================================= */
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --surface-2:#E5EDEC; --ink:#0F2A2B; --muted:#4D6566; --line:#D1DCDB;
  --primary:#1F6F6A; --primary-soft:#DCEEEB; --on-primary:#FFFFFF;
  --inhale:#2F7FD0; --hold:#7B5CC8; --exhale:#1E9A6C; --calm:#1E9A6C; --warn:#B87406; --stress:#D3443A;
  --device:#1A2A2C; --device-edge:#2C4245;
  --focus:#2F63E0; --shadow:0 1px 2px rgba(15,42,43,.05),0 8px 22px rgba(15,42,43,.07);
  --header-bg:rgba(238,243,242,.9);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1B1D; --surface:#142527; --surface-2:#1B3033; --ink:#E3EFED; --muted:#93AAA8; --line:#264040;
    --primary:#5CC6BC; --primary-soft:#163937; --on-primary:#052020;
    --inhale:#6AB2F5; --hold:#A88CF0; --exhale:#4FD3A0; --calm:#4FD3A0; --warn:#F0B44C; --stress:#FF7A6E;
    --device:#081214; --device-edge:#1F3437;
    --focus:#8FB0FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.32);
    --header-bg:rgba(14,27,29,.88); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1B1D; --surface:#142527; --surface-2:#1B3033; --ink:#E3EFED; --muted:#93AAA8; --line:#264040;
  --primary:#5CC6BC; --primary-soft:#163937; --on-primary:#052020;
  --inhale:#6AB2F5; --hold:#A88CF0; --exhale:#4FD3A0; --calm:#4FD3A0; --warn:#F0B44C; --stress:#FF7A6E;
  --device:#081214; --device-edge:#1F3437;
  --focus:#8FB0FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.32);
  --header-bg:rgba(14,27,29,.88); color-scheme:dark;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
code,pre,.mono{font-family:var(--font-mono)}

/* =========================================================
   3. CABEÇALHO E NAVEGAÇÃO
   ========================================================= */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand-mark{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary)}
.brand b{display:block;font-size:1.15rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.74rem;margin-top:3px}
.nav{display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.93rem}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.theme-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 9px;cursor:pointer;font-size:.86rem}
@media (max-width:900px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
  .nav a{flex-direction:column;gap:2px;font-size:.72rem;padding:7px 2px;text-align:center}
  .theme-btn span,.brand small{display:none}
  .theme-btn{padding:8px}
}
main{max-width:1200px;margin:0 auto;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0px))}
@media (min-width:901px){main{padding-bottom:40px}}

/* =========================================================
   4. COMPONENTES
   ========================================================= */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:1.8rem}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h2{font-size:1.08rem;margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-head h2{margin:0}
.stack{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:.93rem;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{border-color:var(--primary);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-danger{color:var(--stress)}
.btn-sm{padding:6px 10px;font-size:.85rem}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:500;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field label,.field .lbl{display:block;font-weight:500;font-size:.9rem;margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:.82rem;margin-top:4px}
.field select,.field input[type=text],.field input[type=number],.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--primary)}
.range output{min-width:44px;text-align:right;font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.93rem}
.toggle input{width:18px;height:18px;accent-color:var(--primary)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:.88rem;color:var(--muted)}
.notice .icon{width:18px;height:18px;color:var(--primary);margin-top:2px}
.notice.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink)}
.notice.warn .icon{color:var(--warn)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:.82rem}
td.num,th.num{text-align:right}
.toast-zone{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:min(92vw,440px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;font-size:.92rem;box-shadow:var(--shadow)}

/* =========================================================
   5. MONITOR: GÊMEO DIGITAL DO DISPOSITIVO
   ========================================================= */
.status-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.states{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.states span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:.84rem;font-weight:500}
.states span.on{background:var(--ink);color:var(--bg)}
.states span.on.lim{background:var(--warn);color:#fff}
.states span.on.int{background:var(--inhale);color:#fff}
.states i{font-style:normal;color:var(--line)}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;color:var(--muted)}
.conn b{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.conn.ok b{background:var(--calm);box-shadow:0 0 0 4px color-mix(in srgb,var(--calm) 25%,transparent)}
.mon{display:grid;gap:16px}
@media (min-width:980px){.mon{grid-template-columns:400px 1fr;align-items:start}}
.device{background:var(--device);border:1px solid var(--device-edge);border-radius:34px;padding:26px 22px 22px;color:#DDE8E7;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),var(--shadow)}
.device-label{position:absolute;top:12px;left:20px;font-size:.72rem;letter-spacing:.06em;color:#7E9997}
.vib{position:absolute;top:12px;right:18px;display:flex;align-items:center;gap:6px;font-size:.72rem;color:#7E9997}
.vib i{width:10px;height:10px;border-radius:50%;background:#2B3E40;transition:background .1s}
.vib.on i{background:#F0B44C;box-shadow:0 0 10px #F0B44C}
.vib.on{animation:tremer .08s linear infinite}
@keyframes tremer{0%{transform:translateX(0)}50%{transform:translateX(1px)}100%{transform:translateX(-1px)}}
.ringbox{position:relative;width:min(300px,74vw);aspect-ratio:1;display:grid;place-items:center}
.led{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#1E2C2E;border:1px solid #2F4446}
.orb{width:66%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 45%),var(--orb,#1E9A6C);transform:scale(.8);color:#fff;
  box-shadow:0 0 60px -10px var(--orb,#1E9A6C)}
.orb b{font-family:var(--font-cond);font-weight:700;font-size:3.4rem;line-height:1}
.orb span{font-size:.92rem;opacity:.92}
.orb.beat{animation:beat .25s ease-out}
@keyframes beat{0%{filter:brightness(1.35)}100%{filter:brightness(1)}}
.oled-box{background:#000;border-radius:8px;padding:8px;border:2px solid #2C3F41}
.oled{width:256px;height:128px;image-rendering:pixelated;display:block;max-width:64vw;height:auto;aspect-ratio:2}
.device-btns{display:flex;gap:8px}
.device-btns button{border:1px solid #33494B;background:#122224;color:#DDE8E7;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.85rem}
.device-btns button:hover{border-color:#5E7B7D}
.readouts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.readouts{grid-template-columns:repeat(4,1fr)}}
.ro{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ro small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.82rem}
.ro b{display:block;font-family:var(--font-cond);font-size:2.3rem;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.ro b em{font-style:normal;font-size:.95rem;font-family:var(--font);color:var(--muted);font-weight:400;margin-left:3px}
.ro .delta{font-size:.8rem;color:var(--muted)}
.heart{color:var(--stress)}
.heart.beat{animation:hb .25s ease-out}
@keyframes hb{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.gauge{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--calm),var(--warn) 55%,var(--stress));position:relative;margin-top:8px}
.gauge i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.gauge u{position:absolute;top:-6px;width:2px;height:20px;background:var(--ink);opacity:.35}
.chart{width:100%;height:150px;display:block}
.chart.tall{height:190px}
.log{list-style:none;margin:0;padding:0;font-size:.88rem;display:grid;gap:4px;max-height:200px;overflow:auto}
.log li{display:flex;gap:10px}
.log time{color:var(--muted);min-width:64px}
.controls{display:grid;gap:14px}
@media (min-width:700px){.controls{grid-template-columns:1fr 1fr}}
.formula{font-family:var(--font-mono);font-size:.85rem;background:var(--surface-2);border-radius:10px;padding:12px;overflow-x:auto;white-space:pre;line-height:1.6}
@media (prefers-reduced-motion:reduce){.vib.on,.orb.beat,.heart.beat{animation:none}}

/* =========================================================
   6. RESPIRAR, PILOTO, ANÁLISE, FIRMWARE
   ========================================================= */
.breathe{display:grid;gap:16px}
@media (min-width:900px){.breathe{grid-template-columns:1fr 340px;align-items:start}}
.breathe-stage{background:var(--device);border-radius:28px;padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:18px;color:#DDE8E7;min-height:460px;justify-content:center}
.breathe-stage .ringbox{width:min(380px,80vw)}
.phase-bar{display:flex;gap:6px;width:min(380px,80vw)}
.phase-bar div{flex:var(--d);height:8px;border-radius:4px;background:#24393B;overflow:hidden}
.phase-bar div i{display:block;height:100%;width:0}
.prot-list{display:grid;gap:8px}
.prot{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer}
.prot[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.prot b{display:block}
.prot span{color:var(--muted);font-size:.86rem}
.steps-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps-nav span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:.83rem}
.steps-nav span.on{background:var(--primary);color:var(--on-primary)}
.steps-nav span.done{background:var(--primary-soft);color:var(--primary)}
.pilot{display:grid;gap:16px}
@media (min-width:980px){.pilot{grid-template-columns:1.2fr 1fr;align-items:start}}
.timer{font-family:var(--font-cond);font-size:4rem;font-weight:600;line-height:1}
.eva{display:grid;gap:8px}
.eva input{width:100%;accent-color:var(--primary)}
.eva-scale{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.eva-val{font-family:var(--font-cond);font-size:3rem;font-weight:600;line-height:1}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;cursor:pointer}
.checks input{width:18px;height:18px;margin-top:3px;accent-color:var(--primary);flex:none}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cmp{border:1px solid var(--line);border-radius:14px;padding:12px}
.cmp small{color:var(--muted);font-size:.82rem}
.cmp div{display:flex;align-items:baseline;gap:8px;font-family:var(--font-cond);font-size:1.5rem;font-weight:600}
.cmp .d{font-size:.95rem}
.good{color:var(--calm)} .bad{color:var(--stress)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:.82rem}
.stat b{display:block;font-family:var(--font-cond);font-size:1.9rem;font-weight:600;line-height:1.15}
.an-grid{display:grid;gap:14px}
@media (min-width:900px){.an-grid{grid-template-columns:1fr 1fr}}
.slope{width:100%;height:240px;display:block}
pre.code{background:var(--device);color:#D7E5E3;border-radius:14px;padding:16px;overflow:auto;max-height:560px;font-size:.8rem;line-height:1.55;margin:0}
.wire td:first-child{font-weight:600}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#monitor" aria-label="CalmPulse, monitor">
      <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l2-5 4 10 3-7 2 2h5"/></svg></span>
      <span><b>CalmPulse</b><small>Extensão FMU | ODS 3</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <button class="theme-btn" id="themeBtn" type="button"></button>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<div class="toast-zone" id="toasts" role="status" aria-live="polite"></div>

<script type="text/plain" id="fwSrc">/*
 * CalmPulse — firmware de referência
 * Projeto de extensão FMU (BCC, manhã) — ODS 3: Saúde e Bem-Estar
 *
 * Hardware: Arduino Nano (ou ESP32), MAX30102 (I2C), GSR por divisor de tensão (A1),
 * anel NeoPixel de 16 LEDs (D6), motor de vibração via transistor (D5),
 * OLED SSD1306 0,96" I2C (SDA A4, SCL A5) e botão (D2).
 */
// ... (O código C++ completo permanece o mesmo do seu original)
</script>

<script>
/* =========================================================
   A. ÍCONES E UTILITÁRIOS
   ========================================================= */
const IC = {
  pulse:'<path d="M2 12h4l2-5 4 10 3-7 2 2h5"/>',
  wind:'<path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/>',
  clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
  chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>',
  auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/>',
  heart:'<path d="M20.8 8.6a5 5 0 0 0-8.8-3.2A5 5 0 0 0 3.2 8.6c0 5 8.8 11 8.8 11s8.8-6 8.8-11Z" fill="currentColor" stroke="none"/>',
  drop:'<path d="M12 2.7 6.3 9.6a7 7 0 1 0 11.4 0Z"/>',
  wave:'<path d="M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/>',
  gauge:'<path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
  usb:'<path d="M12 2v14M8 6l4-4 4 4M7 11v2a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/><circle cx="12" cy="19" r="3"/>',
  play:'<path d="M7 4v16l13-8Z"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',

const icon = (n, cls="") => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = (v, d=1) => v == null || isNaN(v) ? "–" : Number(v).toFixed(d).replace(".", ",");
const hora = (d=new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const media = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : NaN;
const dp = a => { const m = media(a); return Math.sqrt(a.reduce((s,x) => s + (x-m)**2, 0) / (a.length - 1)); };

const pref = {get(k,d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }};

  const a = [30,154,108], b = [214,150,40], c = [211,68,58];
  const mix = (p,q,t) => p.map((v,i) => Math.round(v + (q[i]-v)*t));

/* =========================================================
   C. ESTADO GLOBAL, PROTOCOLOS E CONFIGURAÇÃO
   ========================================================= */
const PROT = {
  "478":{nome:"4-7-8 (Padrão)", desc:"Inspira 4s, segura 7s, solta 8s. Ideal para ansiedade aguda.", fases:[["I",4],["S",7],["E",8]], ciclos:4, cod:0},
  "res":{nome:"Ressonante 6/min", desc:"Inspira 5s, solta 5s, sem retenção. Padrão em biofeedback de VFC.", fases:[["I",5],["E",5]], ciclos:24, cod:1},
  "quad":{nome:"Quadrada 4-4-4-4", desc:"Inspira, segura, solta e segura, 4s cada. Foco e calma.", fases:[["I",4],["S",4],["E",4],["S",4]], ciclos:8, cod:2}
};
const FASE_TXT = {I:"Inspire", S:"Segure", E:"Solte"};
const FASE_COR = {I:"--inhale", S:"--hold", E:"--exhale"};
const ESTADOS = [["CAL","Calibração"],["MON","Monitoramento"],["LIM","Limiar"],["INT","Intervenção"],["REA","Reavaliação"]];

const cfg = Object.assign({limiar:65, tempoAcima:8, pesoGsr:.5, pesoFc:.3, pesoVfc:.2, auto:true, prot:"478", som:true}, pref.get("cp:cfg", {}));
const salvarCfg = () => pref.set("cp:cfg", cfg);

const S = {
  fonte:"sim", serie:[], ibis:[], batidas:0, atual:{bpm:0, gsr:0, rmssd:0, s:50},
  base:{bpm:72, gsr:4, rmssd:40, ok:false},
  maq:{st:"CAL", t:Date.now(), soma:{bpm:0,gsr:0,rmssd:0,n:0}, ultima:-1e9, sAntes:null},
  dev:null, log:[], vibraAte:0, ultimoBatVisto:0
};
function registrar(msg){ S.log.unshift({h:hora(), msg}); S.log = S.log.slice(0, 30); desenharLog(); }

/* =========================================================
   D. SIMULADOR DE SINAIS FISIOLÓGICOS
   ========================================================= */
const SIM = {alvo:.3, nivel:.3, pico:0, proxBat:0, fasico:0, t:0};
function passoSimulador(dt){
  const agora = performance.now();
  SIM.t += dt;
  let alvo = SIM.pico > agora ? .9 : SIM.alvo;
  if (resp.ativo) alvo = Math.max(.12, SIM.nivel - .03);
  SIM.nivel += (alvo - SIM.nivel) * (resp.ativo ? .012 : .02);
  const n = SIM.nivel;

  let rsa = Math.sin(SIM.t * 2 * Math.PI / 4) * 1.5;
  const v = visualResp();
  if (v){ const alvoRsa = v.tipo === "I" ? v.pr : v.tipo === "E" ? 1 - v.pr : (v.anterior === "I" ? 1 : 0); rsa = (alvoRsa - .5) * 12; }
  const fc = 66 + 34*n + rsa;
  if (agora >= SIM.proxBat){
    const ruido = (Math.random() - .5) * 2 * (.07 * (1 - n) + .012);
    const ibi = Math.round(60000 / fc * (1 + ruido));
    if (SIM.proxBat) novoIbi(ibi);
    SIM.proxBat = agora + ibi;
  }
  if (Math.random() < (.003 + .03 * n) * dt * 10) SIM.fasico += .3 + Math.random() * 1.4 * (.4 + n);
  SIM.fasico *= Math.exp(-dt / 3);
  const tonico = 2.6 + 8.5 * n;
  S.atual.gsr = Math.max(.3, tonico + SIM.fasico + (Math.random() - .5) * .05);
}
function novoIbi(ibi){
  S.ibis.push(ibi); if (S.ibis.length > 60) S.ibis.shift();
  S.batidas++; S.ultimoBat = performance.now();
  const ult = S.ibis.slice(-10); S.atual.bpm = 60000 / media(ult);
  const r = S.ibis.slice(-30), dif = [];
  for (let i = 1; i < r.length; i++){ const d = r[i] - r[i-1]; if (Math.abs(d) < 250) dif.push(d*d); }
  if (dif.length >= 4) S.atual.rmssd = Math.sqrt(media(dif));
}

let sSuave = 50;
function calcularIndice(){
  const a = S.atual, b = S.base;
  if (!a.bpm || !a.gsr) return sSuave;
  const zG = (a.gsr - b.gsr) / Math.max(b.gsr * .15, .2);
  const zF = (a.bpm - b.bpm) / 8;
  const zV = (b.rmssd - a.rmssd) / Math.max(b.rmssd * .3, 5);
  const bruto = clamp(50 + 15 * (cfg.pesoGsr*zG + cfg.pesoFc*zF + cfg.pesoVfc*zV), 0, 100);
  sSuave = sSuave * .9 + bruto * .1;
  return sSuave;
}

function iniciarCalibracao(){ S.maq = {...S.maq, st:"CAL", t:Date.now(), soma:{bpm:0,gsr:0,rmssd:0,n:0}}; registrar("Calibração da linha de base iniciada (15 s)"); }
function maquina(){
  const M = S.maq, agora = Date.now(), s = S.atual.s;
  switch (M.st){
    case "CAL":
      if (S.atual.bpm && S.atual.gsr){ M.soma.bpm += S.atual.bpm; M.soma.gsr += S.atual.gsr; M.soma.rmssd += S.atual.rmssd; M.soma.n++; }
      if (agora - M.t >= 15000 && M.soma.n > 50){
        S.base = {bpm:M.soma.bpm/M.soma.n, gsr:M.soma.gsr/M.soma.n, rmssd:Math.max(M.soma.rmssd/M.soma.n, 10), ok:true};
        sSuave = 50; M.st = "MON"; M.t = agora;
        registrar(`Linha de base: ${fmt(S.base.bpm,0)} bpm, ${fmt(S.base.gsr,2)} µS, RMSSD ${fmt(S.base.rmssd,0)} ms`);
      }
      break;
    case "MON":
      if (s >= cfg.limiar){ M.st = "LIM"; M.t = agora; registrar(`Índice acima do limiar (${Math.round(s)} ≥ ${cfg.limiar})`); }
      break;
    case "LIM":
      if (s < cfg.limiar - 3){ M.st = "MON"; M.t = agora; registrar("Índice voltou abaixo do limiar"); }
      else if (agora - M.t >= cfg.tempoAcima*1000 && cfg.auto && rotaAtual === "monitor" && agora - M.ultima >= 90000) iniciarIntervencao("automática");
      break;
    case "INT":
      if (!resp.ativo){ M.st = "REA"; M.t = agora; registrar("Respiração concluída. Reavaliação por 30 s"); }
      break;
    case "REA":
      if (agora - M.t >= 30000){
        registrar(`Reavaliação: índice foi de ${Math.round(M.sAntes)} para ${Math.round(s)}`);
        M.st = "MON"; M.t = agora;
      }
      break;
  }
}
function iniciarIntervencao(origem){
  if (S.fonte === "usb"){ enviar("R"); registrar("Comando enviado ao dispositivo: iniciar respiração"); return; }
  S.maq.st = "INT"; S.maq.t = Date.now(); S.maq.ultima = Date.now(); S.maq.sAntes = S.atual.s;
  resp.iniciar(cfg.prot, PROT[cfg.prot].ciclos);
  registrar(`Intervenção ${origem}: respiração ${PROT[cfg.prot].nome}`);
}

/* =========================================================
   E. MOTOR DA RESPIRAÇÃO GUIADA
   ========================================================= */
const resp = {
  ativo:false, prot:"478", ciclos:4, fase:0, ciclo:0, t0:0, aoFim:null,
  iniciar(p, ciclos, aoFim){ Object.assign(this, {ativo:true, prot:p, ciclos, fase:0, ciclo:0, t0:performance.now(), aoFim}); feedbackFase("I"); },
  parar(){ if (!this.ativo) return; this.ativo = false; const f = this.aoFim; this.aoFim = null; f && f(); },
  tick(){
    if (!this.ativo) return;
    const P = PROT[this.prot], dur = P.fases[this.fase][1] * 1000;
    if (performance.now() - this.t0 >= dur){
      this.fase++; this.t0 = performance.now();
      if (this.fase >= P.fases.length){ this.fase = 0; this.ciclo++; }
      if (this.ciclo >= this.ciclos){ vibrar(400); tom(392, .5); this.parar(); return; }
      feedbackFase(P.fases[this.fase][0]);
    }
  },
  estado(){
    if (!this.ativo) return null;
    const P = PROT[this.prot], [tipo, seg] = P.fases[this.fase];
    const dec = (performance.now() - this.t0) / 1000;
    const anterior = P.fases[(this.fase + P.fases.length - 1) % P.fases.length][0];
    return {tipo, pr:clamp(dec/seg, 0, 1), resta:Math.max(1, Math.ceil(seg - dec)), ciclo:this.ciclo + 1, ciclos:this.ciclos, anterior, fase:this.fase};
  }
};
function visualResp(){
  if (S.fonte === "usb" && S.dev && S.dev.st === "INT" && S.dev.f && S.dev.f !== "-"){
    const P = Object.values(PROT).find(p => p.cod === S.dev.p) || PROT["478"];
    const seg = (P.fases.find(f => f[0] === S.dev.f) || [0,4])[1];
    return {tipo:S.dev.f, pr:S.dev.fr, resta:Math.max(1, Math.ceil(seg * (1 - S.dev.fr))), ciclo:null, anterior:"E"};
  }
  return resp.estado();
}
function vibrar(ms){ S.vibraAte = performance.now() + ms; try{ navigator.vibrate?.(ms); }catch(e){} }
let audio = null;
function tom(freq, dur){
  if (!cfg.som) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + .05);
  }catch(e){}
}
function feedbackFase(tipo){ vibrar(tipo === "S" ? 60 : 150); tom(tipo === "I" ? 523 : tipo === "S" ? 440 : 349, .35); }
function escalaOrb(v){
  if (!v) return null;
  if (v.tipo === "I") return .58 + .42 * v.pr;
  if (v.tipo === "E") return 1 - .42 * v.pr;
  return v.anterior === "I" ? 1 : .58;
}

/* =========================================================
   F. CONEXÃO USB (Web Serial) COM O ARDUINO / ESP32
   ========================================================= */
let porta = null, leitor = null, escritor = null;
async function conectarUSB(){
  if (!("serial" in navigator)){ toast("Este navegador não tem Web Serial. Use Chrome ou Edge no computador."); return false; }
  try{
    porta = await navigator.serial.requestPort();
    await porta.open({baudRate:115200});
  }catch(e){
    toast(e && e.name === "SecurityError" ? "A conexão USB é bloqueada nesta visualização. Baixe o arquivo e abra no Chrome ou Edge." : "Nenhum dispositivo conectado.");
    porta = null; return false;
  }
  const enc = new TextEncoderStream(); enc.readable.pipeTo(porta.writable); escritor = enc.writable.getWriter();
  const dec = new TextDecoderStream(); porta.readable.pipeTo(dec.writable); leitor = dec.readable.getReader();
  S.fonte = "usb"; S.ibis = []; S.serie = []; registrar("Dispositivo conectado pela USB (115200 baud)");
  enviar(String(PROT[cfg.prot].cod));
  lerLinhas(); return true;
}
async function lerLinhas(){
  let buf = "";
  try{
    while (true){
      const {value, done} = await leitor.read(); if (done) break;
      buf += value; let i;
      while ((i = buf.indexOf("\n")) >= 0){ processarLinha(buf.slice(0, i).trim()); buf = buf.slice(i + 1); }
    }
  }catch(e){}
  desconectarUSB(true);
}
function processarLinha(l){
  if (!l.startsWith("{")) return;
  let d; try{ d = JSON.parse(l); }catch(e){ return; }
  if (d.erro){ registrar("Dispositivo: " + d.erro); return; }
  const antes = S.dev; S.dev = d;
  if (antes && d.b !== antes.b && d.ibi) novoIbi(d.ibi);
  S.atual.bpm = d.bpm || 0; S.atual.gsr = d.gsr || 0; S.atual.rmssd = d.rmssd || 0; S.atual.s = d.s ?? S.atual.s;
  if (antes && antes.st !== d.st){
    registrar(`Dispositivo mudou para ${(ESTADOS.find(e => e[0] === d.st) || [0, d.st])[1]}`);
    if (d.f && d.f !== "-") feedbackFase(d.f);
  }
  if (antes && d.st === "INT" && d.f !== antes.f && d.f !== "-") feedbackFase(d.f);
  S.maq.st = d.st;
}
async function enviar(txt){ try{ await escritor?.write(txt); }catch(e){} }
async function desconectarUSB(silencioso){
  try{ await leitor?.cancel(); }catch(e){}
  try{ await escritor?.close(); }catch(e){}
  try{ await porta?.close(); }catch(e){}
  porta = leitor = escritor = null;
  if (S.fonte === "usb"){ S.fonte = "sim"; S.dev = null; S.ibis = []; S.serie = []; iniciarCalibracao(); if (!silencioso) toast("Dispositivo desconectado. Voltando ao simulador."); else registrar("Conexão USB encerrada"); }
  if (rotaAtual === "monitor") render();
}

/* =========================================================
   G. LAÇO PRINCIPAL
   ========================================================= */
setInterval(() => {
  if (S.fonte === "sim"){
    passoSimulador(.1);
    if (S.maq.st !== "CAL") S.atual.s = calcularIndice();
    maquina();
  }
  resp.tick();
  S.serie.push({t:Date.now(), bpm:S.atual.bpm, gsr:S.atual.gsr, rmssd:S.atual.rmssd, s:S.atual.s});
  if (S.serie.length > 1200) S.serie.shift();
  piloto.coletar();
}, 100);

let ultimoGrafico = 0, ultimoOled = 0, ultimoTexto = 0;
function quadro(ts){
  const v = visualResp();
  document.querySelectorAll("[data-ring]").forEach(r => desenharAnel(r, v));
  document.querySelectorAll("[data-orb]").forEach(o => desenharOrb(o, v));
  const vb = document.getElementById("vib"); if (vb) vb.classList.toggle("on", performance.now() < S.vibraAte);
  if (S.batidas !== S.ultimoBatVisto){
    S.ultimoBatVisto = S.batidas;
    document.querySelectorAll(".heart,[data-orb]").forEach(e => { e.classList.remove("beat"); void e.offsetWidth; e.classList.add("beat"); });
  }
  if (ts - ultimoTexto > 250){ ultimoTexto = ts; atualizarTextos(); }
  if (ts - ultimoGrafico > 66){ ultimoGrafico = ts; desenharGraficos(); }
  if (ts - ultimoOled > 250){ ultimoOled = ts; desenharOled(v); }
  requestAnimationFrame(quadro);
}

function montarAnel(box){
  box.insertAdjacentHTML("afterbegin", Array.from({length:16}, (_,i) => `<span class="led" style="transform:rotate(${i*22.5}deg) translateY(calc(var(--r) * -1))"></span>`).join(""));
}
function desenharAnel(box, v){
  const leds = box.querySelectorAll(".led"); if (!leds.length) return;
  let cor, acesos, brilho = 1;
  if (v){
    cor = corVar(FASE_COR[v.tipo]);
    acesos = v.tipo === "I" ? Math.floor(v.pr * 16) + 1 : v.tipo === "E" ? 16 - Math.floor(v.pr * 16) : 16;
  } else if (S.maq.st === "CAL"){
    const i = Math.floor(performance.now() / 80) % 16;
    leds.forEach((l,k) => { l.style.background = k === i ? "#9AA9A8" : "#1E2C2E"; l.style.boxShadow = k === i ? "0 0 10px #9AA9A8" : "none"; });
    return;
  } else {
    cor = corEstresse(S.atual.s); acesos = 16;
    brilho = performance.now() - (S.ultimoBat || 0) < 120 ? 1 : .45;
  }
  leds.forEach((l,k) => {
    const on = k < acesos;
    l.style.background = on ? cor : "#1E2C2E";
    l.style.opacity = on ? brilho : 1;
    l.style.boxShadow = on ? `0 0 ${brilho > .5 ? 14 : 6}px ${cor}` : "none";
  });
}
function desenharOrb(o, v){
  const esc = escalaOrb(v);
  if (v){
    o.style.setProperty("--orb", corVar(FASE_COR[v.tipo]));
    o.style.transform = `scale(${esc})`;
    o.innerHTML = `<span>${FASE_TXT[v.tipo]}</span><b>${v.resta}</b><span>${v.ciclo ? `ciclo ${v.ciclo} de ${v.ciclos}` : "segundos"}</span>`;
  } else {
    const s = Math.round(S.atual.s);
    o.style.setProperty("--orb", S.maq.st === "CAL" ? "#4D6566" : corEstresse(s));
    o.style.transform = `scale(${.8 + .05 * Math.sin(performance.now() / 1200)})`;
    const html = S.maq.st === "CAL" ? `<span>Calibrando</span><b>${Math.max(0, 15 - Math.floor((Date.now() - S.maq.t)/1000))}</b><span>segundos</span>` : `<span>Índice</span><b>${s}</b><span>de 0 a 100</span>`;
    if (o.dataset.html !== html){ o.innerHTML = html; o.dataset.html = html; }
    return;
  }
  o.dataset.html = "";
}

function desenharOled(v){
  const cv = document.getElementById("oled"); if (!cv) return;
  const c = cv.getContext("2d"); c.fillStyle = "#000"; c.fillRect(0, 0, 128, 64);
  c.fillStyle = "#fff"; c.textBaseline = "top";
  c.font = "8px monospace"; c.fillText("CalmPulse", 0, 0); c.fillText(S.maq.st, 108, 0);
  if (v){
    c.font = "bold 16px monospace"; c.fillText(FASE_TXT[v.tipo].toUpperCase(), 0, 16);
    c.fillText(v.resta + "s", 0, 40);
    if (v.ciclo){ c.font = "8px monospace"; c.fillText(`ciclo ${v.ciclo}/${v.ciclos}`, 64, 48); }
    // INSIGHT CLÍNICO ADICIONADO NO OLED
    if (v.tipo === "E" && v.ciclo === 1) { c.font = "8px monospace"; c.fillText("SpO2 Estavel", 0, 58); }
  } else {
    c.font = "8px monospace";
    c.fillText(`FC   ${S.atual.bpm ? Math.round(S.atual.bpm) : "--"} bpm`, 0, 13);
    c.fillText(`GSR  ${S.atual.gsr.toFixed(2)} uS`, 0, 25);
    c.fillText(`VFC  ${Math.round(S.atual.rmssd)} ms`, 0, 37);
    if (S.maq.st === "CAL") c.fillText("calib.", 90, 13);
    c.fillRect(0, 52, 128, 1); c.fillRect(0, 61, 128, 1); c.fillRect(0, 52, 1, 10); c.fillRect(127, 52, 1, 10);
    c.fillRect(2, 54, Math.round(S.atual.s * 1.24), 6);
    c.fillRect(2 + Math.round(cfg.limiar * 1.24), 50, 1, 14);
  }
  const img = c.getImageData(0, 0, 128, 64), p = img.data;
  for (let i = 0; i < p.length; i += 4){ const on = p[i] > 110; p[i] = on ? 150 : 0; p[i+1] = on ? 220 : 0; p[i+2] = on ? 255 : 0; p[i+3] = 255; }
  c.putImageData(img, 0, 0);
}

function grafico(cv, chave, o){
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w*dpr || cv.height !== h*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
  const c = cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  const agora = Date.now(), jan = 60000, dados = S.serie.filter(p => agora - p.t <= jan && p[chave]);
  const L = 34, R = 8, T = 8, B = 18;
  let min = o.min, max = o.max;
  if (min == null){ const vs = dados.map(p => p[chave]); min = Math.min(...vs); max = Math.max(...vs); const m = (max - min) * .2 || 1; min -= m; max += m; if (!isFinite(min)){ min = 0; max = 1; } }
  const X = t => L + (w - L - R) * (1 - (agora - t) / jan), Y = v => T + (h - T - B) * (1 - (v - min) / (max - min));
  c.font = "11px 'IBM Plex Sans', sans-serif"; c.fillStyle = cores["--muted"]; c.strokeStyle = cores["--line"]; c.lineWidth = 1;
  for (let i = 0; i <= 3; i++){ const v = min + (max - min) * i / 3, y = Y(v); c.beginPath(); c.moveTo(L, y); c.lineTo(w - R, y); c.stroke(); c.fillText(v.toFixed(o.dec ?? 0).replace(".", ","), 2, y - 6); }
  c.fillText("60 s", L, h - 13); c.fillText("agora", w - R - 32, h - 13);
  if (o.limiar != null){ c.setLineDash([5,4]); c.strokeStyle = cores["--warn"]; c.beginPath(); c.moveTo(L, Y(o.limiar)); c.lineTo(w - R, Y(o.limiar)); c.stroke(); c.setLineDash([]); }
  if (dados.length < 2) return;
  c.strokeStyle = o.cor; c.lineWidth = 2; c.lineJoin = "round"; c.beginPath();
  dados.forEach((p,i) => { const x = X(p.t), y = Y(p[chave]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke();
  c.lineTo(X(dados[dados.length-1].t), h - B); c.lineTo(X(dados[0].t), h - B); c.closePath();
  c.globalAlpha = .1; c.fillStyle = o.cor; c.fill(); c.globalAlpha = 1;
}
function desenharGraficos(){
  if (rotaAtual !== "monitor" && rotaAtual !== "piloto") return;
  grafico(document.getElementById("gS"), "s", {min:0, max:100, cor:cores["--stress"], limiar:cfg.limiar});
  grafico(document.getElementById("gB"), "bpm", {cor:cores["--inhale"]});

function gammln(x){ const c = [76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5]; let y = x, t = x + 5.5; t -= (x + .5) * Math.log(t); let s = 1.000000000190015; for (const k of c) s += k / ++y; return -t + Math.log(2.5066282746310005 * s / x); }
function betacf(a,b,x){ let qab = a+b, qap = a+1, qam = a-1, c = 1, d = 1 - qab*x/qap; if (Math.abs(d) < 1e-30) d = 1e-30; d = 1/d; let h = d;
  for (let m = 1; m <= 200; m++){ const m2 = 2*m; let aa = m*(b-m)*x/((qam+m2)*(a+m2)); d = 1+aa*d; if (Math.abs(d) < 1e-30) d = 1e-30; c = 1+aa/c; if (Math.abs(c) < 1e-30) c = 1e-30; d = 1/d; h *= d*c;
    aa = -(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d = 1+aa*d; if (Math.abs(d) < 1e-30) d = 1e-30; c = 1+aa/c; if (Math.abs(c) < 1e-30) c = 1e-30; d = 1/d; const del = d*c; h *= del; if (Math.abs(del-1) < 3e-12) break; } return h; }
function betai(a,b,x){ if (x <= 0) return 0; if (x >= 1) return 1; const bt = Math.exp(gammln(a+b)-gammln(a)-gammln(b)+a*Math.log(x)+b*Math.log(1-x)); return x < (a+1)/(a+b+2) ? bt*betacf(a,b,x)/a : 1 - bt*betacf(b,a,1-x)/b; }
const pT = (t, df) => betai(df/2, .5, df/(df + t*t));
function tPareado(a, b){
  const d = b.map((v,i) => v - a[i]).filter(v => !isNaN(v)), n = d.length; if (n < 3) return null;
  const md = media(d), sd = dp(d), t = md / (sd / Math.sqrt(n));
  return {n, md, t, p: sd ? pT(Math.abs(t), n - 1) : 0, dz: sd ? md / sd : 0};
}
function pearson(x, y){
  const n = x.length; if (n < 4) return null; const mx = media(x), my = media(y);
  let sxy = 0, sxx = 0, syy = 0; for (let i = 0; i < n; i++){ sxy += (x[i]-mx)*(y[i]-my); sxx += (x[i]-mx)**2; syy += (y[i]-my)**2; }
  const r = sxy / Math.sqrt(sxx*syy), t = r * Math.sqrt((n-2) / (1 - r*r));
  return {r, n, p:pT(Math.abs(t), n - 2)};
}
const fmtP = p => p == null ? "–" : p < .001 ? "< 0,001" : fmt(p, 3);

function inclinacao(cv, pares, o){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr; const c = cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  const vals = pares.flat(); let min = o.min ?? Math.min(...vals), max = o.max ?? Math.max(...vals);
  if (o.min == null){ const m = (max - min) * .1 || 1; min -= m; max += m; }
  const X1 = w * .28, X2 = w * .72, Y = v => 16 + (h - 44) * (1 - (v - min) / (max - min));
  c.font = "12px 'IBM Plex Sans', sans-serif"; c.fillStyle = cores["--muted"]; c.textAlign = "center";
  c.fillText("Antes", X1, h - 8); c.fillText("Depois", X2, h - 8);
  c.strokeStyle = cores["--line"]; c.beginPath(); c.moveTo(X1, 10); c.lineTo(X1, h - 26); c.moveTo(X2, 10); c.lineTo(X2, h - 26); c.stroke();
  c.textAlign = "right"; [min, (min+max)/2, max].forEach(v => c.fillText(v.toFixed(o.dec).replace(".", ","), X1 - 10, Y(v) + 4));
  pares.forEach(([a,b]) => { const melhor = o.desc ? b < a : b > a, cor = b === a ? cores["--muted"] : melhor ? cores["--calm"] : cores["--stress"];
    c.strokeStyle = cor; c.globalAlpha = .55; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X1, Y(a)); c.lineTo(X2, Y(b)); c.stroke();
    c.globalAlpha = 1; c.fillStyle = cor; [[X1,a],[X2,b]].forEach(([x,v]) => { c.beginPath(); c.arc(x, Y(v), 3.5, 0, 7); c.fill(); }); });
  const ma = media(pares.map(p => p[0])), mb = media(pares.map(p => p[1]));
  c.strokeStyle = cores["--ink"]; c.lineWidth = 3.5; c.beginPath(); c.moveTo(X1, Y(ma)); c.lineTo(X2, Y(mb)); c.stroke();
  c.textAlign = "left"; c.fillStyle = cores["--ink"]; c.fillText("média " + mb.toFixed(o.dec).replace(".", ","), X2 + 10, Y(mb) + 4);
}

        <tr><td>GSR (2 eletrodos)</td><td>Eletrodo 1 em 5V; eletrodo 2 em A1 e resistor de 100 kΩ de A1 para GND</td></tr>
        <tr><td>Anel NeoPixel (16)</td><td>DIN em D6 com resistor de 330 Ω; capacitor de 1000 µF na alimentação</td></tr>
        <tr><td>Motor de vibração</td><td>D5 → 1 kΩ → base do transistor 2N2222; diodo 1N4007 em paralelo com o motor</td></tr>
        <tr><td>OLED 0,96" I2C</td><td>SDA em A4; SCL em A5; endereço 0x3C</td></tr>
        <tr><td>Botão</td><td>Entre D2 e GND (pull-up interno)</td></tr>
      </tbody></table></div></section>
      <section class="card"><h2>Protocolo serial (115200 baud)</h2>
        <p class="muted" style="margin:0 0 8px;font-size:.9rem">Uma linha JSON a cada 100 ms:</p>
        <div class="formula">{"t":12345,"bpm":72.4,"ibi":829,"b":57,"rmssd":41.2,
 "gsr":4.85,"s":52,"st":"MON","f":"-","fr":0.00,"p":0}</div>
        <div class="table-wrap" style="margin-top:10px"><table><tbody>
          <tr><td><code>st</code></td><td>Estado: CAL, MON, LIM, INT ou REA</td></tr>
          <tr><td><code>f</code>, <code>fr</code></td><td>Fase da respiração (I, S, E) e progresso de 0 a 1</td></tr>
          <tr><td><code>b</code>, <code>ibi</code></td><td>Contador de batimentos e último intervalo em ms</td></tr>
          <tr><td>Comandos</td><td><code>R</code> respirar, <code>X</code> parar, <code>L</code> recalibrar, <code>0</code> a <code>2</code> protocolo</td></tr>
        </tbody></table></div></section>
    </div>

  app.querySelector("#code").textContent = src;
  app.querySelector("#copiar").onclick = async () => {
    try{ await navigator.clipboard.writeText(src); toast("Código copiado."); }
    catch(e){ const r = document.createRange(); r.selectNodeContents(app.querySelector("#code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Código selecionado. Use Ctrl+C para copiar."); }
  };

/* =========================================================
   M. ROTAS
   ========================================================= */
const ROTAS = [["monitor","Monitor","pulse"],["respirar","Respirar","wind"],["piloto","Sessão piloto","clip"],["analise","Análise","chart"],["firmware","Firmware","chip"]];
let rotaAtual = "monitor";
function rota(){
  const h = (location.hash || "#monitor").slice(1);
  const nova = ROTAS.some(r => r[0] === h) ? h : "monitor";
  if (nova !== rotaAtual && rotaAtual === "respirar" && resp.ativo && S.maq.st !== "INT") resp.parar();
  rotaAtual = nova; render(); window.scrollTo(0,0);
}
function render(){
  const app = document.getElementById("app");
  ({monitor:telaMonitor, respirar:telaRespirar, piloto:telaPiloto, analise:telaAnalise, firmware:telaFirmware})[rotaAtual](app);
  document.getElementById("nav").innerHTML = ROTAS.map(([id,r,ic]) => `<a href="#${id}" ${id===rotaAtual?'aria-current="page"':""}>${icon(ic)}<span>${r}</span></a>`).join("");
}
window.addEventListener("hashchange", rota);
window.addEventListener("resize", () => { if (rotaAtual === "analise") render(); });

aplicarTema(); iniciarCalibracao(); rota(); requestAnimationFrame(quadro);
</script>
